name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  backend:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: facegate_test
          POSTGRES_USER: facegate
          POSTGRES_PASSWORD: facegate_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U facegate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    env:
      DATABASE_URL: "postgresql://facegate:facegate_pass@localhost:5432/facegate_test?schema=public"
      JWT_SECRET: "ci-jwt-secret-for-backend-tests-only"

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      # #62: typecheck wajib — code yang tidak kompil tidak boleh lolos CI.
      - run: bunx tsc --noEmit
      - run: bunx prisma generate

      # Image pgvector/pgvector TIDAK auto-create extension di POSTGRES_DB
      # (hanya file-nya yang tersedia) — harus di-create manual sebelum db push.
      - name: Enable pgvector extension
        run: echo "CREATE EXTENSION IF NOT EXISTS vector;" | bunx prisma db execute --url "$DATABASE_URL" --stdin

      - run: bunx prisma db push --accept-data-loss

      - run: bun run src/seed.ts

      - run: bun test

      # Background process dibunuh saat step selesai → start & health check dalam satu step.
      - name: Start server & health check
        run: |
          bun run src/index.ts &
          sleep 3
          curl -s http://localhost:8150/api/health | grep -q '"status":"ok"'

  android:
    name: Android Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./android

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # #62: Gradle 8.11.1 butuh Java 21 (17 gagal di setup ini).
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit test :core
        run: ./gradlew :core:testDebugUnitTest

      - name: Build :core
        run: ./gradlew :core:assembleDebug

      - name: Build :kiosk-scanner
        run: ./gradlew :kiosk-scanner:assembleDebug

      - name: Build :admin-app
        run: ./gradlew :admin-app:assembleDebug

      - name: Upload Kiosk APK
        uses: actions/upload-artifact@v4
        with:
          name: kiosk-scanner-apk
          path: android/kiosk-scanner/build/outputs/apk/debug/*.apk

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: admin-app-apk
          path: android/admin-app/build/outputs/apk/debug/*.apk
